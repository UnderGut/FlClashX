name: build-android-manual

# Artifact-only Android build on Linux (avoids broken Windows-host cross-compile of libclash.so).
# No public release, no Telegram. APK uploaded as a workflow-run artifact.
# Release-signs if the KEYSTORE secret is set; otherwise falls back to debug signing.
on:
  push:
    branches:
      - "build/pre12-mihomo1925"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android Signing
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties
          echo "Release signing enabled"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build Android
        run: dart setup.dart android --env stable

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: flclashx-android-pre12-mihomo1925
          path: ./dist
          overwrite: true
